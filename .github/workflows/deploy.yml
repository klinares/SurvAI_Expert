# Deploys RAG Time to shinyapps.io on every push to main.
# Repo secrets: SHINYAPPS_NAME, SHINYAPPS_TOKEN, SHINYAPPS_SECRET (required to
#   deploy), and optionally OPENROUTER_API_KEY + RAGTIME_PASSPHRASE to ship your
#   key inside the deployed bundle (never in git), unlocked by the passphrase.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHINYAPPS_NAME:   ${{ secrets.SHINYAPPS_NAME }}
      SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
      SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RAGTIME_PASSPHRASE: ${{ secrets.RAGTIME_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >-
            any::rsconnect, any::shiny, any::bslib, any::shinychat, any::ellmer,
            any::httr2, any::duckdb, any::DBI, any::dplyr, any::purrr,
            any::stringr, any::tibble, any::katex, any::commonmark, any::htmltools

      - name: Check the app's code parses and the store is present
        shell: Rscript {0}
        run: |
          files <- c("shiny_app.R", list.files("R", "\\.R$", full.names = TRUE))
          invisible(lapply(c(files, "deploy.R"), parse))
          stopifnot(file.exists("store/jpsm.duckdb"))
          cat("ok:", length(files), "files parse; store present\n")

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        run: |
          if (!nzchar(Sys.getenv("SHINYAPPS_TOKEN"))) {
            cat("::warning::shinyapps.io secrets not set; skipping deploy.\n")
            quit(status = 0)
          }
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_NAME"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET"))
          source("deploy.R")
